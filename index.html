<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAOS MVP Sprint 4</title>
<style>
*{box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;margin:0;background:#f5f6f8;color:#18181b}.shell{max-width:1120px;margin:auto;padding:32px 20px}.brand{font-size:25px;font-weight:800;letter-spacing:.08em}.muted{color:#71717a}.panel{background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:22px;margin-top:20px;box-shadow:0 8px 24px rgba(0,0,0,.035)}input,textarea,select{width:100%;padding:11px 13px;border:1px solid #d4d4d8;border-radius:9px;margin:7px 0 13px;font:inherit}textarea{min-height:88px}button{padding:10px 14px;border:0;border-radius:9px;background:#18181b;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e4e4e7;color:#18181b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.brief,.option,.memory,.evidence,.action{border:1px solid #e4e4e7;border-radius:13px;padding:16px;background:#fff}.brief,.memory,.evidence,.action{margin-top:12px}.hidden{display:none}.top,.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.nav button{background:#fff;color:#18181b;border:1px solid #d4d4d8}.tag{font-size:12px;background:#f4f4f5;border-radius:999px;padding:4px 8px}.section{margin-top:18px}.section h3{margin-bottom:6px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.option.selected{outline:2px solid #18181b}.error{color:#b91c1c;margin-top:10px}.ok{color:#166534}.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#71717a}.callout{background:#fafafa;border-left:4px solid #18181b;padding:12px 14px;border-radius:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.grid,.options,.two{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="shell"><div class="brand">VAOS</div><div class="muted">CEO Decision Operating System · Sprint 4 · Pilot Ready</div>
<section id="loginPanel" class="panel"><h1>Sign in</h1><label>Email</label><input id="email" value="ceo@vaos.example"><label>Password</label><input id="password" type="password" value="ChangeMe123!"><button onclick="login()">Sign In</button><div id="loginError" class="error"></div></section>
<section id="appPanel" class="hidden"><div class="panel top"><div><h1 id="welcome">VAOS Home</h1><div id="company" class="muted"></div></div><button onclick="logout()">Logout</button></div>
<div class="nav"><button onclick="showHome()">Home</button><button onclick="showBriefs()">CEO Brief</button><button onclick="showDecisions()">Decisions</button><button onclick="showMemory()">Decision Memory</button></div><div id="view"></div></section></div>
<script>
let token=localStorage.getItem('vaos_token'),selectedOptionId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers.Authorization=`Bearer ${token}`;let r=await fetch(path,opt),b=await r.json();if(!r.ok)throw new Error(b.detail||'Request failed');return b};
async function login(){try{loginError.textContent='';let b=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});token=b.data.access_token;localStorage.setItem('vaos_token',token);await boot()}catch(e){loginError.textContent=e.message}}
async function boot(){try{let b=await api('/api/home');loginPanel.classList.add('hidden');appPanel.classList.remove('hidden');welcome.textContent=b.data.greeting;company.textContent=b.data.company;renderHome(b.data)}catch(e){localStorage.removeItem('vaos_token');token=null;loginPanel.classList.remove('hidden');appPanel.classList.add('hidden')}}
function renderHome(d){view.innerHTML=`<section class="panel"><h2>Today</h2><div class="grid">${d.cards.map(c=>`<div class="card"><div class="label">${esc(c.title)}</div><h2>${esc(c.value)}</h2><span class="tag">${esc(c.status.replaceAll('_',' '))}</span></div>`).join('')}</div></section>`}
async function showHome(){let b=await api('/api/home');renderHome(b.data)}
async function showBriefs(){let b=await api('/api/briefs');view.innerHTML=`<section class="panel"><h2>CEO Brief</h2><p class="muted">Important operating signals requiring attention.</p>${b.data.map(x=>`<div class="brief"><div class="row"><h3>${esc(x.title)}</h3><span class="tag">${esc(x.status)}</span></div><p><b>What changed:</b> ${esc(x.what_changed)}</p><p><b>Why it matters:</b> ${esc(x.why_it_matters)}</p><p><b>Evidence:</b> ${esc(x.evidence)}</p><p><b>Risk / Opportunity:</b> ${esc(x.risk_opportunity)}</p><p><b>Recommended action:</b> ${esc(x.recommended_action)}</p><div class="row"><button class="secondary" onclick="ack(${x.id})">Acknowledge</button><button onclick="openDecision(${x.id})">Open Decision</button></div></div>`).join('')||'<p>No briefs.</p>'}</section>`}
async function ack(id){await api(`/api/briefs/${id}/acknowledge`,{method:'PATCH'});await showBriefs()}
async function openDecision(id){let b=await api(`/api/briefs/${id}/open-decision`,{method:'POST'});renderDecision(b.data)}
async function showDecisions(){let b=await api('/api/decisions');view.innerHTML=`<section class="panel"><h2>Decisions</h2>${b.data.map(d=>`<div class="brief"><div class="row"><div><b>${esc(d.issue)}</b><div class="muted">Decision #${d.id}</div></div><span class="tag">${esc(d.status)}</span></div><br><button onclick="loadDecision(${d.id})">Open</button></div>`).join('')||'<p>No decisions yet.</p>'}</section>`}
async function loadDecision(id){let b=await api(`/api/decisions/${id}`);renderDecision(b.data)}
function renderDecision(d){selectedOptionId=d.record?.selected_option_id||null;view.innerHTML=`<section class="panel"><div class="row"><div><div class="label">Decision Workspace</div><h2>${esc(d.issue)}</h2></div><span class="tag">${esc(d.status)}</span></div>
<div class="section"><h3>Evidence</h3>${d.evidence_items.map(e=>`<div class="evidence"><b>${esc(e.source_type)}</b>${e.source_reference?` · <span class="muted">${esc(e.source_reference)}</span>`:''}<p>${esc(e.content)}</p></div>`).join('')||'<p>No evidence.</p>'}<div class="two"><input id="newEvidence" placeholder="Add decision-specific evidence"><input id="evidenceSource" placeholder="Source reference (optional)"></div><button class="secondary" onclick="addEvidence(${d.id})">Add Evidence</button></div>
<div class="section"><div class="row"><h3>AI Analysis</h3><button onclick="runAnalysis(${d.id})">Run AI Analysis</button></div>${d.ai_analysis?`<div class="callout"><p>${esc(d.ai_analysis)}</p><p><b>Assumptions:</b> ${esc(d.assumptions)}</p><p><b>Confidence:</b> ${esc(d.confidence)}</p><p><b>Missing information:</b> ${esc(d.missing_information)}</p></div>`:'<p class="muted">Not analyzed yet. AI only receives the context and evidence shown for this decision.</p>'}<div id="analysisMsg" class="error"></div></div>
${d.options.length?`<div class="section"><h3>Options</h3><div class="options">${d.options.map(o=>`<div id="opt${o.id}" class="option ${o.id===selectedOptionId?'selected':''}" onclick="selectOption(${o.id})"><div class="row"><b>${esc(o.name)}</b>${o.is_recommended?'<span class="tag">Recommended</span>':''}</div><p>${esc(o.description)}</p><small><b>Benefits:</b> ${esc(o.benefits)}<br><b>Risks:</b> ${esc(o.risks)}<br><b>Impact:</b> ${esc(o.expected_impact)}</small></div>`).join('')}</div></div><div class="section"><h3>Recommendation</h3><p>${esc(d.recommendation)}</p></div>`:''}
${d.record?`<div class="section"><h3>Confirmed Decision</h3><p><b>${esc(d.record.final_decision)}</b></p><p>${esc(d.record.decision_reason)}</p></div>`:`<div class="section"><h3>CEO Decision</h3><label>Final decision</label><textarea id="finalDecision"></textarea><label>Decision reason</label><textarea id="decisionReason"></textarea><button onclick="confirmDecision(${d.id})">Confirm Decision</button><div id="decisionMsg" class="error"></div></div>`}
${d.record?renderExecution(d):''}</section>`}
function renderExecution(d){return `<div class="section"><h3>Execution</h3>${d.actions.map(a=>`<div class="action"><div class="row"><b>${esc(a.description)}</b><span class="tag">${esc(a.status)}</span></div><p>Owner: ${esc(a.owner)}${a.due_date?` · Due: ${esc(a.due_date)}`:''}</p><p><b>Expected:</b> ${esc(a.expected_result)}</p>${a.status!=='completed'?`<button class="secondary" onclick="completeAction(${a.id},${d.id})">Mark Completed</button>`:''}</div>`).join('')||'<p class="muted">No action items yet.</p>'}<div class="two"><input id="actionOwner" placeholder="Owner"><input id="actionDue" placeholder="Due date e.g. 2026-09-15"></div><textarea id="actionDesc" placeholder="Action description"></textarea><textarea id="expectedResult" placeholder="Expected measurable result"></textarea><button class="secondary" onclick="createAction(${d.id})">Create Action</button></div>
<div class="section"><h3>Result Review</h3>${d.result_review?`<div class="callout"><p><b>Actual result:</b> ${esc(d.result_review.actual_result)}</p><p><b>Variance:</b> ${esc(d.result_review.variance)}</p><p><b>Possible reasons:</b> ${esc(d.result_review.possible_reasons)}</p><p><b>Lesson learned:</b> ${esc(d.result_review.lesson_learned)}</p></div>`:`<textarea id="actualResult" placeholder="What actually happened?"></textarea><textarea id="lessonLearned" placeholder="Human-confirmed lesson learned"></textarea><button onclick="submitResult(${d.id})">Complete Result Review</button><div id="resultMsg" class="error"></div>`}</div>`}
function selectOption(id){selectedOptionId=id;document.querySelectorAll('.option').forEach(e=>e.classList.remove('selected'));document.getElementById('opt'+id)?.classList.add('selected')}
async function addEvidence(id){try{let b=await api(`/api/decisions/${id}/evidence`,{method:'POST',body:JSON.stringify({content:newEvidence.value,source_type:'manual',source_reference:evidenceSource.value||null})});renderDecision(b.data)}catch(e){analysisMsg.textContent=e.message}}
async function runAnalysis(id){try{analysisMsg.textContent='Analyzing...';let b=await api(`/api/decisions/${id}/analyze`,{method:'POST'});renderDecision(b.data)}catch(e){analysisMsg.textContent=e.message}}
async function confirmDecision(id){try{decisionMsg.textContent='';let b=await api(`/api/decisions/${id}/confirm`,{method:'POST',body:JSON.stringify({selected_option_id:selectedOptionId,final_decision:finalDecision.value,decision_reason:decisionReason.value})});renderDecision(b.data)}catch(e){decisionMsg.textContent=e.message}}
async function createAction(id){try{let b=await api(`/api/decisions/${id}/actions`,{method:'POST',body:JSON.stringify({owner:actionOwner.value,description:actionDesc.value,due_date:actionDue.value||null,expected_result:expectedResult.value})});renderDecision(b.data)}catch(e){alert(e.message)}}
async function completeAction(actionId,decisionId){let b=await api(`/api/actions/${actionId}`,{method:'PATCH',body:JSON.stringify({status:'completed'})});renderDecision(b.data)}
async function submitResult(id){try{resultMsg.textContent='';let b=await api(`/api/decisions/${id}/result-review`,{method:'POST',body:JSON.stringify({actual_result:actualResult.value,lesson_learned:lessonLearned.value})});renderDecision(b.data)}catch(e){resultMsg.textContent=e.message}}
async function showMemory(){let b=await api('/api/decision-memory');view.innerHTML=`<section class="panel"><h2>Decision Memory</h2><p class="muted">AI recommendation, human decision, execution and learning remain traceable.</p>${b.data.map(d=>`<div class="memory"><div class="row"><div><b>${esc(d.issue)}</b><div class="muted">Decision #${d.id}</div></div><span class="tag">${esc(d.status)}</span></div><p><b>AI recommendation:</b> ${esc(d.recommendation)}</p><p><b>Final:</b> ${esc(d.record.final_decision)}</p><p><b>Reason:</b> ${esc(d.record.decision_reason)}</p>${d.result_review?`<p><b>Lesson:</b> ${esc(d.result_review.lesson_learned)}</p>`:''}<button onclick="loadDecision(${d.id})">Open Record</button></div>`).join('')||'<p>No confirmed decisions yet.</p>'}</section>`}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch(e){}localStorage.removeItem('vaos_token');token=null;location.reload()}if(token)boot();
</script></body></html>
